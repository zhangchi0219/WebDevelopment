services:
  gallery:
    build: .
    container_name: photo-gallery
    ports:
      - "3000:3000"
    volumes:
      - gallery-data:/app/data
      - gallery-uploads:/app/public/uploads
    environment:
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/photos"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  gallery-data:
  gallery-uploads:
