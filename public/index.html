<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 照片画廊</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 管理员面板 -->
  <div id="admin-panel" class="admin-panel">
    <div class="admin-header">
      <h2>照片管理</h2>
      <button id="close-admin" class="close-btn">&times;</button>
    </div>
    <div class="admin-stats">
      <span>共 <strong id="admin-photo-count">0</strong> 张照片</span>
      <button id="open-database" class="db-btn">查看数据库</button>
    </div>
    <div id="photo-grid" class="photo-grid">
      <!-- 照片将通过 JS 动态添加 -->
    </div>
  </div>

  <!-- 数据库查看模态框 -->
  <div id="database-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>数据库记录</h2>
        <button id="close-database" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <table id="database-table" class="db-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>文件名</th>
              <th>原始名称</th>
              <th>类型</th>
              <th>大小</th>
              <th>创建时间</th>
            </tr>
          </thead>
          <tbody id="database-tbody">
            <!-- 数据将通过 JS 动态添加 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <button id="open-admin" class="open-admin-btn">管理照片</button>
  <button id="show-qrcode" class="qrcode-btn">扫码上传</button>

  <!-- 二维码模态框 -->
  <div id="qrcode-modal" class="modal hidden">
    <div class="modal-content qrcode-modal-content">
      <div class="modal-header">
        <h2>扫码上传照片</h2>
        <button id="close-qrcode" class="close-btn">&times;</button>
      </div>
      <div class="modal-body qrcode-body">
        <div id="qrcode-container"></div>
        <p class="qrcode-url" id="qrcode-url"></p>
        <p class="qrcode-hint">使用手机扫描二维码上传照片</p>
      </div>
    </div>
  </div>

  <!-- 展开上传面板按钮 -->
  <button id="expand-panel" class="expand-btn">+</button>

  <!-- 上传面板 -->
  <div id="upload-panel" class="panel">
    <h2>照片上传</h2>
    <div class="upload-area" id="upload-area">
      <input type="file" id="file-input" accept="image/*" multiple hidden>
      <div class="upload-icon">+</div>
      <p>点击或拖拽照片到这里上传</p>
      <p class="hint">支持 JPG, PNG, GIF, WebP (最大 10MB)</p>
    </div>
    <div id="upload-progress" class="upload-progress hidden">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span id="progress-text">上传中...</span>
    </div>
    <div class="stats">
      <span>已上传: <strong id="photo-count">0</strong> 张照片</span>
    </div>
    <button id="clear-photos" class="clear-btn">清除所有照片</button>
    <button id="toggle-panel" class="toggle-btn">收起面板</button>
  </div>

  <!-- Three.js 画布容器 -->
  <div id="canvas-container"></div>

  <!-- 提示信息 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 加载指示器 -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>

  <!-- 操作提示 -->
  <div id="controls-hint" class="controls-hint">
    <p>鼠标拖拽旋转 | 滚轮缩放 | 右键平移 | 点击照片查看大图</p>
  </div>

  <!-- 大图预览 -->
  <div id="lightbox" class="lightbox hidden">
    <img id="lightbox-img" src="" alt="照片预览">
  </div>

  <!-- 引入 Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- 引入 QRCode 库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
